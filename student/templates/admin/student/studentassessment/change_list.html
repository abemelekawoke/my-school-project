{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    {{ block.super }}
    <li>
        <a href="{% url 'admin:student_studentassessment_generate' %}"
           class="addlink"
           onclick="openGenerateModal(event); return false;">
            Generate Assessments
        </a>
    </li>
{% endblock %}

{% block content %}
    {{ block.super }}

    <dialog id="modal-generate"
            style="position:fixed;
                   top:50%;
                   left:50%;
                   transform:translate(-50%,-50%);
                   margin:0;
                   padding:0;
                   width:min(92vw, 36rem);
                   max-height:88vh;
                   overflow:auto;
                   border:none;
                   border-radius:0.5rem;
                   box-shadow:0 12px 48px rgba(0,0,0,0.35);
                   z-index:9999;
                   background:#fff;">
        <div style="padding:1.5rem;">
            <h3 style="font-weight:700; font-size:1.125rem; margin:0 0 1rem 0;">
                Generate Student Assessments
            </h3>
            <div id="modal-generate-body">Loading…</div>
        </div>
    </dialog>

    <style>
        /* Prevent DaisyUI / Bootstrap .modal rules from hijacking our <dialog> */
        dialog#modal-generate[open] { display: block; }
        dialog#modal-generate::backdrop {
            background: rgba(0, 0, 0, 0.55);
        }
    </style>

    <script>
    (function () {
        const dlg  = document.getElementById('modal-generate');
        const body = document.getElementById('modal-generate-body');

        window.openGenerateModal = function (e) {
            if (e) e.preventDefault();

            if (!body.dataset.loaded) {
                fetch("{% url 'admin:student_studentassessment_generate' %}", {
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                })
                .then(r => r.text())
                .then(html => {
                    body.innerHTML = html;
                    body.dataset.loaded = "1";
                    // Re-execute inline scripts (innerHTML doesn't run them)
                    body.querySelectorAll("script").forEach(old => {
                        const s = document.createElement("script");
                        s.textContent = old.textContent;
                        document.body.appendChild(s);
                    });
                })
                .catch(() => { body.textContent = "Failed to load form."; });
            }

            if (typeof dlg.showModal === "function") {
                dlg.showModal();
            } else {
                // Fallback for very old browsers
                dlg.setAttribute("open", "open");
            }
        };

        // Click on backdrop closes the modal
        dlg.addEventListener('click', (e) => {
            const rect = dlg.getBoundingClientRect();
            const inside =
                e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top  && e.clientY <= rect.bottom;
            if (!inside) dlg.close();
        });

        // ESC already closes <dialog> natively — nothing to do.
    })();
    </script>
{% endblock %}
