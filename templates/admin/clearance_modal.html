{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<style>
    .clearance-modal {
        max-width: 720px;
        margin: 30px auto;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        overflow: hidden;
    }
    .clearance-modal .modal-header {
        background: #417690;
        color: #fff;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
    }
    .clearance-modal .modal-body {
        padding: 22px 26px;
    }
    .clearance-modal .form-row {
        margin-bottom: 18px;
    }
    /* 👇 Underline ONLY the label text */
    .clearance-modal label.underlined-label {
        display: inline-block;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-thickness: 1.5px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
        font-size: 14px;
    }
    .clearance-modal input.form-control {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
    .clearance-modal input.form-control:focus {
        outline: none;
        border-color: #417690;
        box-shadow: 0 0 0 2px rgba(65,118,144,0.2);
    }
    .clearance-modal .modal-footer {
        padding: 14px 26px;
        border-top: 1px solid #eee;
        background: #fafafa;
        text-align: right;
    }
    .clearance-modal .btn {
        padding: 7px 18px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
    }
    .clearance-modal .btn-primary {
        background: #417690;
        color: #fff;
    }
    .clearance-modal .btn-secondary {
        background: #e0e0e0;
        color: #333;
        margin-right: 6px;
    }
</style>

<div class="clearance-modal">
    <div class="modal-header">
       የኪንግስ ት/ቤት የተማሪ የመውጫ ቅጽ &mdash; {{ student.Full_name }}
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="modal-body">
            {% for field in form %}
                <div class="form-row">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}፡
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color:#b00020; font-size:12px; margin-top:4px;">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <div class="modal-footer">
            <a href="{% url 'admin:student_studentprofile_changelist' %}"
               class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
