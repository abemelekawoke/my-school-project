<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Add CSS for overall page styling -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fc;
            color: #343a40;
        }

        header {
            background-color: #4e73df;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .filters {
            margin-bottom: 20px;
            text-align: center;
        }

        .filters label {
            margin: 0 10px;
            font-weight: bold;
        }

        .filters select {
            padding: 6px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #d1d3e2;
        }

        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-item {
            flex: 1 1 calc(33% - 20px);
            max-width: calc(33% - 20px);
            background: white;
            border: 1px solid #e3e6f0;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            height: 280px; /* Adjust chart height */
        }

        .chart-item h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #4e73df;
        }

        .chart-item canvas {
            max-height: 200px; /* Adjust chart height */
        }

        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .chart-item {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        Student Dashboard
    </header>

    <div class="main-content">
        <div class="filters">
            <label for="year-select">Year:</label>
            <select id="year-select">
                <option value="2024">2024</option>
                <option value="2023">2023</option>
            </select>
            <label for="month-select">Month:</label>
            <select id="month-select">
                <option value="January">January</option>
                <option value="February">February</option>
            </select>
        </div>

        <div class="chart-container">
            <div class="chart-item">
                <h3>Gender Distribution</h3>
                <canvas id="genderPieChart"></canvas>
            </div>
            <div class="chart-item">
                <h3>Number of Students by Grade</h3>
                <canvas id="feeBarChart"></canvas>
            </div>
            <div class="chart-item">
                <h3>Total Payments by Month</h3>
                <canvas id="additionalBarChart"></canvas>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2024 Student Dashboard. All rights reserved.
    </footer>

    <script>
        const ctxGender = document.getElementById('genderPieChart').getContext('2d');
        new Chart(ctxGender, {
            type: 'pie',
            data: {
                labels: {{ gender_labels|safe }},
                datasets: [{
                    data: {{ gender_counts|safe }},
                    backgroundColor: ['#36a2eb', '#ff6384'],
                    hoverBackgroundColor: ['#2c9eff', '#ff4976']
                }]
            },
            options: { responsive: true }
        });

        const ctxFee = document.getElementById('feeBarChart').getContext('2d');
        new Chart(ctxFee, {
            type: 'bar',
            data: {
                labels: {{ student_labels|safe }},
                datasets: [{
                    label: 'Total Students',
                    data: {{ total_student|safe }},
                    backgroundColor: '#4e73df'
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        const ctxPayments = document.getElementById('additionalBarChart').getContext('2d');
        new Chart(ctxPayments, {
            type: 'bar',
            data: {
                labels: {{ student_fee_labels|safe }},
                datasets: [{
                    label: 'Total Payments',
                    data: {{ student_fee_sum|safe }},
                    backgroundColor: '#ffcc00'
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
